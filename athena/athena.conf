# Athena cluster (multi-GPU) — config for athena/deploy_athena.sh
# # Login host: athena.technion.ac.il, hostname athena-login, SLURM ClusterName=athena.

ATHENA_USER="evyatarrubin"
ATHENA_HOST="athena.technion.ac.il"
REMOTE_BASE="/home/${ATHENA_USER}/bragg_sim_athena"

# CPU count for the local Python steps (build_sweep_list, etc.) — same as dgx side.
N_CPUS=8

# Per-task SLURM time limit for --option3 arrays. Short for backfill-friendliness;
# bump per-run if a sim hits the wall.
ARRAY_TIME=00:50:00

# QOS naming convention on this cluster: "<max_time>_<max_gpus>".
ARRAY_QOS=24h_1g     # GPU jobs (engine, single, sweep, convergence)
AGG_QOS=4h_0g        # CPU-only aggregator

# Auto-pick partition list: SLURM tries each in order, takes the first free
# slot matching the resource request. Order = preference for FDTD
# (memory-bandwidth bound):
#   H200 (4.8 TB/s HBM3)  >  A100 (2 TB/s HBM2e)  >  L40S (0.86 TB/s GDDR6)
#
# rtx6k-shared (RTX PRO 6000 Blackwell) is INTENTIONALLY EXCLUDED:
# Lumerical 2026R1's bundled CUDA 12.2 cannot initialize on Blackwell
# (R595 / CUDA 13.2). FDTD aborts with "unsupported display driver / cuda
# driver combination" and silently falls through to S-param extraction
# with no field data. Verified empirically with job 76905 on n318
# (May 5 2026). Re-add when Lumerical ships a Blackwell-compatible build,
# or override per-run via `--gpu=rtx6k`.
ARRAY_PARTITIONS="h200-shared,a100-public,l40s-public"
AGG_PARTITION="l40s-public"   # any partition that allows CPU-only jobs

# Lumerical license — DISCOVERED from past licdebug logs on this cluster.
# The athena cluster proxies to lumerical-lm.ece.technion.ac.il (132.68.48.51).
# Note: athena uses ports 1055 / 2325 (standard Ansys); dgx uses 11055 / 12325.
ATHENA_LICENSE="1055@132.68.48.51"
ATHENA_INTERCONNECT="2325@132.68.48.51"

# Keep parity with athena.conf for any other consumed env vars
MAX_CONCURRENT=4
NTFY_TOPIC=""
