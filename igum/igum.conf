# IGUM cluster (Technion ECE faculty) — config for igum/deploy_igum.sh
# Login/dev nodes: 132.68.58.101/.102/.103 (igum-login1/2; FQDN not resolvable
# off-cluster — use the raw IP). Requires Technion VPN. Docs: igum.ece.technion.ac.il
# Monitoring (Zabbix): igum-zabbix.ece.technion.ac.il:3000
#
# NOTE: partition/account/qos below are from the Technion admin email 2026-07-25
# ("ClassC" notice: salloc -N1 --partition=part-lumerical --account=acct-lumerical
#  --qos=qos-lumerical --gres=gpu:3 --cpus-per-task=8 --mem=32G).
# Verified 2026-10-06: acct-lumerical association and one-GPU test-only
# submissions on both configured lanes. Both QOS records report REQUEUE,
# MaxWallPJ=10080 minutes. Recheck current limits before a big dispatch;
# sacctmgr is unavailable here, use scontrol show assoc_mgr flags=qos.

IGUM_USER="evyatarrubin"
IGUM_HOST="132.68.58.101"
# (igum.ece.technion.ac.il resolves to 132.68.48.37 — that's the docs/web host,
# NOT a login node; don't point IGUM_HOST at it.)
# Work lives via ~/research -> /research/amir.r/evyatarrubin.
# Snapshot 2026-10-06: research 124T total, 24T available. Recheck df; these
# are shared-volume figures, not an allocation or a guarantee of user quota.
REMOTE_BASE="/home/${IGUM_USER}/research/bragg_sim_igum"

# CPU count for the local Python steps (build_sweep_list, etc.) — same as athena side.
N_CPUS=8

# Per-task SLURM time limit for --option3 arrays. Admin email doesn't state a
# MaxWall — check `sacctmgr show qos qos-lumerical format=Name,MaxWall` on first
# login; if it clamps below this, lower it here.
ARRAY_TIME=23:30:00

# IGUM convention: QOS name must MATCH the partition name (qos-lumerical <->
# part-lumerical), and every submit also needs --account (SLURM_ACCOUNT below).
# USER RULE (2026-07-27): sweeps default to the A100 pool (part-preempt) —
# the dedicated part-lumerical GPUs are considerably weaker, use them only
# when no A100 is available (preemption is fine for independent array tasks).
# Optimizations/inverse-design placement: TBD by user — AGG_* stays on
# part-lumerical until decided.
ARRAY_QOS=qos-lumerical   # 2026-10-20: qos-preempt now REJECTED for this account ('Invalid qos specification'); part-lumerical/qos-lumerical accepted (2 nodes)
AGG_QOS=qos-lumerical

ARRAY_PARTITIONS="part-lumerical"   # 2026-10-20: see ARRAY_QOS note; part-preempt requires qos-preempt which we no longer hold
AGG_PARTITION="part-lumerical"
# A100 option (verified 2026-07-25): 48× A100 via part-preempt — set
# ARRAY_QOS/AGG_QOS=qos-preempt + ARRAY_PARTITIONS/AGG_PARTITION=part-preempt
# (account stays acct-lumerical). PREEMPTIBLE: independent sweep tasks only,
# never long stateful optimizations.

# IGUM requires an account on every submit (athena does not).
SLURM_ACCOUNT="acct-lumerical"

# IGUM docs use --gres=gpu:N (athena uses --gpus=1). Admin's salloc template asks
# for gpu:3, but one FDTD sim uses 1 GPU (multi-GPU per sim is capped at 1 anyway)
# — request 1 per array task so we don't idle 2 GPUs per license seat. If submits
# are rejected with a gres/QOS minimum error, raise to gpu:3.
GPU_REQ="--gres=gpu:1"

# Native Lumerical also available via modules (admin email 2026-07-25):
#   module use /apps/modulefiles && module load lumerical/2026R1.2
# — use as fallback if the hardcoded /apps/ansys path ever moves. GUI
# (fdtd-solutions) available by RDP on igum-login5.

# Lumerical license — SAME FlexLM server as athena (lumerical-lm.ece.technion.ac.il,
# physically in ECE). Seats are SHARED across clusters: budget MAX_CONCURRENT
# against whatever athena is currently running.
# Variable names kept as ATHENA_* on purpose — every job script and --export
# list reads these names; renaming would touch everything for nothing.
ATHENA_LICENSE="1055@132.68.48.51"
ATHENA_INTERCONNECT="2325@132.68.48.51"

# Conservative: license seats shared with live athena runs.
MAX_CONCURRENT=4
NTFY_TOPIC=""
