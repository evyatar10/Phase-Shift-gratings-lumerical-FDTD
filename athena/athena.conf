# ── Athena cluster configuration ──────────────────────────────────────────────
# Edit this file to configure your Athena GPU jobs.
# Sourced by hpc_gpu/deploy_athena.sh — do not add bash logic here.

# ── Connection ─────────────────────────────────────────────────────────────────
ATHENA_USER="evyatarrubin"
ATHENA_HOST="dgx-master.technion.ac.il"
REMOTE_BASE="/home/${ATHENA_USER}/bragg_sim_gpu"

# ── Resource allocation ────────────────────────────────────────────────────────
# N_GPUS is hardcoded to 1 in deploy_athena.sh — multi-GPU per single FDTD sim
# is not available on the Technion lum_fdtd_solve license tier (setresource
# 'processes' silently capped at 1). For throughput, use --option3 (job array,
# 1 GPU per task) instead. Probed 2026-04-27.
N_CPUS=16              # CPU threads        (pre/post processing)

# Per-task SLURM time limit for --option3 (Python pipeline arrays).
# Bumped to 01:15:00 to absorb long sims at higher cells / N_periods.
ARRAY_TIME=01:15:00

# Max concurrent SLURM array tasks (FSP array + Python --option3 array).
# Bounded by lum_fdtd_solve license seats — run `bash athena/deploy_athena.sh
# --license-probe` to discover the actual seat count, then raise this.
MAX_CONCURRENT=6

# ── Notifications ──────────────────────────────────────────────────────────────
NTFY_TOPIC=""   # set to your ntfy.sh topic to enable push notifications   # ntfy.sh topic — change or clear to disable

