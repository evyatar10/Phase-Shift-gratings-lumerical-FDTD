# IGUM cluster (Technion ECE faculty) — config for igum/deploy_igum.sh
# Login/dev nodes: 132.68.58.101/.102/.103 (igum-login1/2; FQDN not resolvable
# off-cluster — use the raw IP). Requires Technion VPN. Docs: igum.ece.technion.ac.il
# Monitoring (Zabbix): igum-zabbix.ece.technion.ac.il:3000
#
# NOTE: values marked TODO-RECON are placeholders until the Phase-2 recon
# (sacctmgr/sinfo on the login node) confirms them. Do NOT dispatch before then.

IGUM_USER="evyatarrubin"
IGUM_HOST="132.68.58.101"
# Work lives on the research volume (28T, ~12T free) via the ~/research symlink
# (-> /research/amir.r/evyatarrubin). Home volume itself is small and 92% full —
# keep only ~/containers + ~/scilibs there.
REMOTE_BASE="/home/${IGUM_USER}/research/bragg_sim_igum"

# CPU count for the local Python steps (build_sweep_list, etc.) — same as athena side.
N_CPUS=8

# Per-task SLURM time limit for --option3 arrays. TODO-RECON: clamp to QOS MaxWall.
ARRAY_TIME=23:30:00

# IGUM convention: QOS name must MATCH the partition name (qos-preempt <-> part-preempt),
# and every submit also needs --account (SLURM_ACCOUNT below). part-preempt is
# PREEMPTIBLE — fine for independent sweep tasks, avoid for long stateful optimizations.
ARRAY_QOS=qos-preempt      # TODO-RECON: confirm via sacctmgr show assoc
AGG_QOS=qos-preempt

ARRAY_PARTITIONS="part-preempt"   # TODO-RECON: prepend part-<advisor> if one exists
AGG_PARTITION="part-preempt"

# IGUM requires an account on every submit (athena does not).
SLURM_ACCOUNT="acct-preempt"      # TODO-RECON: confirm via sacctmgr show assoc

# IGUM docs use --gres=gpu:N (athena uses --gpus=1).
GPU_REQ="--gres=gpu:1"

# Lumerical license — SAME FlexLM server as athena (lumerical-lm.ece.technion.ac.il,
# physically in ECE). Seats are SHARED across clusters: budget MAX_CONCURRENT
# against whatever athena is currently running.
# Variable names kept as ATHENA_* on purpose — every job script and --export
# list reads these names; renaming would touch everything for nothing.
ATHENA_LICENSE="1055@132.68.48.51"
ATHENA_INTERCONNECT="2325@132.68.48.51"

# Conservative: license seats shared with live athena runs.
MAX_CONCURRENT=4
NTFY_TOPIC=""
